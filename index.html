<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dff3ff"><title>Машинки на выезд</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:#183047;background:#dff3ff;overflow:hidden}header{text-align:center;padding:12px 8px;background:#fff;box-shadow:0 3px 12px #0001;position:relative;z-index:3}h1{font-size:clamp(22px,5vw,36px);margin:0}header p{font-size:14px;margin:5px 0 0}#game{height:calc(100dvh - 94px);min-height:390px;position:relative;overflow:hidden;background:linear-gradient(#96d9ff 0%,#e3f7ff 63%,#b2e59c 63%)}.cloud{position:absolute;font-size:48px;opacity:.8;pointer-events:none}.c1{top:8%;left:10%}.c2{top:17%;right:10%}#message{position:absolute;top:7%;left:4%;right:4%;text-align:center;font-size:clamp(20px,4vw,30px);font-weight:800;text-shadow:0 2px #fff;z-index:1}#status{position:absolute;top:17%;left:5%;right:5%;text-align:center;font-size:14px;z-index:1}.road{position:absolute;left:0;right:0;bottom:7%;height:34%;background:#5d6874;border-top:7px solid white;border-bottom:7px solid white}.road:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:5px dashed white}.grass{position:absolute;bottom:0;height:7%;width:100%;background:#70c15a}.vehicle{position:absolute;z-index:2;left:-230px;bottom:17%;width:min(230px,58vw);height:clamp(90px,24vw,125px);padding:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 4px 2px #0002)}.vehicle svg{width:100%;height:100%;display:block}.vehicle.selected{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 4px 2px #0002)}.arrive{animation:arrive 1.35s cubic-bezier(.2,.7,.2,1) forwards}.depart{animation:depart 1.1s ease-in forwards}@keyframes arrive{from{left:-230px}to{left:calc(50% - min(115px,29vw))}}@keyframes depart{from{left:calc(50% - min(115px,29vw))}to{left:110%}}#controls{position:absolute;bottom:1%;left:0;right:0;text-align:center;z-index:4}.control{border:0;border-radius:16px;padding:11px 15px;margin:3px;background:white;color:#183047;font-size:14px;font-weight:750;box-shadow:0 4px 0 #adcbd7;cursor:pointer;touch-action:manipulation}#mute{position:absolute;right:10px;top:10px;z-index:5;width:43px;height:43px;border:0;border-radius:50%;font-size:21px;background:white}@media(max-height:560px){header{padding:5px}#game{height:calc(100dvh - 74px)}#message{top:3%}#status{top:13%}.road{height:40%}.vehicle{bottom:14%}.control{padding:7px 10px}}
</style></head>
<body><header><h1>🚒 Машинки на выезд 🚑</h1><p>Нажми один раз — звук. Нажми ещё раз — уезжает. Выбери другую — первая уступит дорогу.</p></header>
<main id="game"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div id="message">Машинка уже в пути…</div><div id="status">Ожидаем приезда</div><button id="mute" title="Звук">🔊</button><div class="road"></div><div class="grass"></div><div id="controls"><button class="control" id="next">➡️ Другая машинка</button><button class="control" id="replay">🔄 Повторить приезд</button></div></main>
<script>
const cars=[
 {name:'Скорая помощь',emoji:'🚑',kind:'ambulance',color:'#fafafa'},
 {name:'Пожарная машина',emoji:'🚒',kind:'fire',color:'#e53935'},
 {name:'Полиция',emoji:'🚓',kind:'police',color:'#fafafa'},
 {name:'Мусоровоз',emoji:'🚛',kind:'garbage',color:'#38a85a'},
 {name:'Эвакуатор',emoji:'🚚',kind:'tow',color:'#ffbf38'},
 {name:'Трактор',emoji:'🚜',kind:'tractor',color:'#edb827'},
 {name:'Экскаватор',emoji:'🚧',kind:'excavator',color:'#efb72b'},
 {name:'Бульдозер',emoji:'🚜',kind:'bulldozer',color:'#e7b12a'}
];
const audio={};cars.forEach(c=>{const a=new Audio('sounds/'+c.kind+'.mp3');a.preload='auto';a.volume=.85;audio[c.kind]=a;});
const game=document.querySelector('#game'),message=document.querySelector('#message'),status=document.querySelector('#status');let index=0,active=null,selected=false,moving=false,muted=false,turn=0;
function drawCar(c){let details='';if(c.kind==='ambulance')details='<path d="M67 21H92V41H52Z" fill="#9ee4ff" stroke="#333" stroke-width="3"/><path d="M97 21h18q10 0 15 20H97Z" fill="#9ee4ff" stroke="#333" stroke-width="3"/><path d="M78 27h9v7h-9zM80 24h5v13h-5z" fill="#e53935"/><text x="45" y="57" font-size="10" font-weight="bold" fill="#e53935">СКОРАЯ</text>';
else if(c.kind==='police')details='<path d="M67 23H92V41H52Z" fill="#9ee4ff" stroke="#333" stroke-width="3"/><path d="M97 23h18q10 0 15 18H97Z" fill="#9ee4ff" stroke="#333" stroke-width="3"/><rect x="79" y="14" width="12" height="7" fill="#e33"/><rect x="91" y="14" width="12" height="7" fill="#168bff"/><text x="43" y="57" font-size="10" font-weight="bold" fill="#14569b">ПОЛИЦИЯ</text>';
else if(c.kind==='fire')details='<path d="M38 28h89v9H38z" fill="#f8d13e" stroke="#333" stroke-width="2"/><path d="M53 40h45V26H72" fill="#9ee4ff" stroke="#333" stroke-width="3"/><text x="102" y="59" font-size="12" font-weight="bold" fill="white">01</text>';
else if(c.kind==='garbage')details='<path d="M62 28h65q7 0 11 14H62z" fill="#79ce8a" stroke="#333" stroke-width="3"/><path d="M72 31v9m13-9v9m13-9v9m13-9v9" stroke="#268c44" stroke-width="3"/>';
else if(c.kind==='tow')details='<path d="M68 26h29v16H54z" fill="#9ee4ff" stroke="#333" stroke-width="3"/><path d="M124 14l19 28h-7l-18-23z" fill="#666" stroke="#333" stroke-width="3"/>';
else if(c.kind==='tractor')details='<path d="M81 30h32v17H81z" fill="#9ee4ff" stroke="#333" stroke-width="3"/><circle cx="51" cy="67" r="19" fill="#252a30"/><circle cx="51" cy="67" r="8" fill="#d7e1e7"/><circle cx="128" cy="67" r="12" fill="#252a30"/><circle cx="128" cy="67" r="5" fill="#d7e1e7"/>';
else if(c.kind==='excavator')details='<path d="M54 43V28H87L98 43Z" fill="#9ee4ff" stroke="#333" stroke-width="3"/><path d="M87 31l24-20 8 5-18 26" fill="none" stroke="#e0a51b" stroke-width="10"/><path d="M116 15l14-4 2 11-12 6z" fill="#e0a51b" stroke="#333" stroke-width="3"/><path d="M31 64h99" stroke="#252a30" stroke-width="10"/>';
else details='<path d="M81 34h29v13H81z" fill="#9ee4ff" stroke="#333" stroke-width="3"/><path d="M25 55L13 68H42l5-10z" fill="#adb8bf" stroke="#333" stroke-width="3"/><path d="M31 66h105" stroke="#252a30" stroke-width="10"/>';
let body=(c.kind==='tractor'||c.kind==='excavator'||c.kind==='bulldozer')?'<path d="M30 44H112L133 50V66H30Z"/>':'<path d="M15 43Q15 36 25 36H48L66 20H116Q132 20 141 40L160 46Q168 49 168 58V69H14V50Q14 44 15 43Z"/>';
const wheels='<circle cx="48" cy="68" r="13" fill="#252a30" stroke="#111" stroke-width="3"/><circle cx="48" cy="68" r="5" fill="#d7e1e7"/><circle cx="133" cy="68" r="13" fill="#252a30" stroke="#111" stroke-width="3"/><circle cx="133" cy="68" r="5" fill="#d7e1e7"/><rect x="19" y="48" width="10" height="7" rx="2" fill="#fff3ad"/><rect x="159" y="49" width="7" height="7" rx="2" fill="#ff615b"/>';
return '<svg viewBox="0 0 180 92" aria-hidden="true"><ellipse cx="91" cy="83" rx="73" ry="5" fill="#000" opacity=".12"/><g fill="'+c.color+'" stroke="#303943" stroke-width="3" stroke-linejoin="round">'+body+'</g>'+details+wheels+'</svg>';}
function stopAll(){Object.values(audio).forEach(a=>{a.pause();try{a.currentTime=0}catch(e){}})}
function play(c){if(muted)return;stopAll();const a=audio[c.kind];a.currentTime=0;a.play().catch(()=>{status.textContent=c.kind==='ambulance'?'Не удалось запустить MP3. Проверь файл sounds/ambulance.mp3.':'Для этой машинки ещё не загружен реальный MP3-файл.';});}
function addCar(i){const c=cars[i],el=document.createElement('button');el.type='button';el.className='vehicle arrive';el.setAttribute('aria-label',c.name);el.title=c.name;el.innerHTML=drawCar(c);el.onclick=()=>choose(i);game.appendChild(el);active=el;selected=false;message.textContent=c.emoji+' '+c.name;status.textContent='Машинка приезжает…';moving=true;const my=++turn;setTimeout(()=>{if(my!==turn)return;moving=false;el.classList.remove('arrive');status.textContent='Нажми на машинку, чтобы услышать её';},1400);}
function choose(i){if(moving||!active)return;if(selected&&i===index){leave((index+1)%cars.length);return;}selected=true;active.classList.add('selected');play(cars[index]);message.textContent=cars[index].emoji+' '+cars[index].name;status.textContent='Звук включён. Нажми ещё раз, чтобы машинка уехала, или выбери другую.';}
function leave(next){if(!active||moving)return;moving=true;stopAll();const old=active;old.classList.remove('selected','arrive');old.classList.add('depart');message.textContent=cars[index].emoji+' Машинка уезжает!';status.textContent='Следующая машинка уже едет…';const my=++turn;setTimeout(()=>{if(my!==turn)return;old.remove();active=null;index=next;addCar(index);},1150);}
document.querySelector('#next').onclick=()=>{if(moving)return;leave((index+1)%cars.length);};document.querySelector('#replay').onclick=()=>{if(moving)return;if(active)leave(index);else addCar(index);};document.querySelector('#mute').onclick=()=>{muted=!muted;document.querySelector('#mute').textContent=muted?'🔇':'🔊';if(muted)stopAll();status.textContent=muted?'Звук выключен':'Звук включён';};addCar(index);
</script></body></html>
